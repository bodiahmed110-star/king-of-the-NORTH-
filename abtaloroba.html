<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل دوري الأبطال - ملك الشمال</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        body {
            background-color: #000508;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* زر العودة للرئيسية */
        .back-home {
            align-self: flex-start;
            text-decoration: none;
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #040d12;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 212, 255, 0.2);
            border: 1px solid #002b36;
            text-align: center;
        }

        h1 {
            color: #00d4ff;
            font-size: 24px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
            border-bottom: 2px solid #003e4d;
            padding-bottom: 15px;
        }

        .champions-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .champion-item {
            background-color: #001219;
            border: 1px solid #002b36;
            border-right: 6px solid #00d4ff;
            border-radius: 12px;
            padding: 18px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: right;
            display: block;
            text-decoration: none;
            outline: none;
        }

        /* تأثير التوهج اللبني عند الضغط (النسخة المنورة) */
        .champion-item:active, .champion-item:focus {
            border-color: #00fbff;
            box-shadow: 0 0 25px rgba(0, 212, 255, 0.7), inset 0 0 10px rgba(0, 212, 255, 0.3);
            background-color: #001a24;
            transform: scale(0.97);
        }

        .champ-name {
            font-size: 18px;
            font-weight: bold;
            display: block;
        }

        .version-tag {
            color: #00d4ff;
            font-size: 13px;
            background: rgba(0, 212, 255, 0.1);
            padding: 3px 12px;
            border-radius: 8px;
            margin-right: 10px;
            border: 1px solid rgba(0, 212, 255, 0.3);
            font-weight: normal;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            border-top: 1px solid #001a24;
            width: 100%;
            padding-top: 20px;
        }

        .dev-link {
            color: #00d4ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 17px;
        }

        .rights {
            font-size: 12px;
            color: #444;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-home">🔙 العودة للرئيسية</a>

    <div class="container">
        <h1>🏆 أبطال دوري أبطال أوروبا 🏆</h1>
        
        <div class="champions-list">
            
            <div class="champion-item" tabindex="0">
                <span class="champ-name">محمود سامح <span class="version-tag">النسخة الأولى</span></span>
            </div>

            <div class="champion-item" tabindex="0">
                <span class="champ-name">ادم سبايدر <span class="version-tag">النسخة الثانية</span></span>
            </div>

            <div class="champion-item" tabindex="0">
                <span class="champ-name">عبده طارق <span class="version-tag">النسخة الثالثة</span></span>
            </div>

            <div class="champion-item" tabindex="0">
                <span class="champ-name">احمد حمادة <span class="version-tag">النسخة الرابعة</span></span>
            </div>

            <div class="champion-item" tabindex="0">
                <span class="champ-name">كريم بدر <span class="version-tag">النسخة الخامسة</span></span>
            </div>

        </div>
    </div>

    <footer>
        <a href="https://wa.me/201145612162" class="dev-link" target="_blank">Developer: 3bdo a7med</a>
        <div class="rights">جميع الحقوق محفوظة © 2025 / 2026</div>
    </footer>

</body>
</html>
