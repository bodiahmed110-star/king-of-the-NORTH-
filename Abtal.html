<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الأبطال - 3bdo a7med</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .champions-container {
            width: 100%;
            max-width: 450px;
            background: #161616;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin-bottom: 40px; /* مسافة قبل التذييل */
        }

        h1 {
            color: #ffcc00;
            font-size: 24px;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            border-bottom: 2px solid #333;
            padding-bottom: 15px;
        }

        .champions-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .champion-item {
            background-color: #1f1f1f;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px 18px;
            color: white;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            outline: none;
            width: 100%;
            border-style: solid;
        }

        /* تأثير التوهج عند الضغط */
        .champion-item:active, .champion-item:focus {
            border-color: #00ffcc;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.6), inset 0 0 10px rgba(0, 255, 204, 0.4);
            background-color: #1a1a1a;
            transform: scale(0.97);
        }

        .rank-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rank {
            background: #ffcc00;
            color: #000;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
        }

        .score {
            font-weight: bold;
            color: #ffcc00;
        }

        /* تنسيق أسفل الصفحة (Footer) */
        footer {
            text-align: center;
            margin-top: auto;
            padding: 20px;
            width: 100%;
        }

        .developer-link {
            color: #00ffcc;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            display: block;
            margin-bottom: 8px;
        }

        .developer-link:hover {
            text-shadow: 0 0 10px #00ffcc;
            transform: translateY(-2px);
        }

        .rights {
            font-size: 14px;
            color: #777;
        }
    </style>
</head>
<body>

<div class="champions-container">
    <h1>🏆 سجل أبطال البطولة 🏆</h1>
    
    <div class="champions-list">
        <button class="champion-item">
            <div class="rank-name"><span class="rank">1</span> 👤 عبده طارق</div>
            <div class="score">5🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">2</span> 👤 طلعت</div>
            <div class="score">3🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">3</span> 👤 الفرعوني</div>
            <div class="score">2🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">4</span> 👤 محمد علاء</div>
            <div class="score">1🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">5</span> 👤 خالو اسامة</div>
            <div class="score">1🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">6</span> 👤 احمد طارق</div>
            <div class="score">1🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">7</span> 👤 زين</div>
            <div class="score">1🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">8</span> 👤 ادهم علاء</div>
            <div class="score">1🏆</div>
        </button>

        <button class="champion-item">
            <div class="rank-name"><span class="rank">9</span> 👤 ادم</div>
            <div class="score">1🏆</div>
        </button>
    </div>
</div>

<footer>
    <!-- رابط الواتساب عند الضغط على اسمك -->
    <a href="https://wa.me/201145612162" class="developer-link" target="_blank">
        Developer: 3bdo a7med
    </a>
    <div class="rights">
        جميع الحقوق محفوظة لموقع 2025/2026
    </div>
</footer>

</body>
</html>
